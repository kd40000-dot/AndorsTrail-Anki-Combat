name: Build Andor's Trail UI Playground APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'andors-trail-combat/overlay/**'
      - '.github/workflows/build_andors_trail_ui_playground.yml'

permissions:
  contents: read

concurrency:
  group: andors-trail-ui-playground
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout integration files
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            andors-trail-combat
            tools

      - name: Checkout maintained October 15 game integration
        uses: actions/checkout@v5
        with:
          repository: kd40000-dot/Anki-Android
          ref: c2a148e5c35a4bb70a1beb407be4787947759381
          path: stable-integration
          sparse-checkout: andors-trail-combat

      - name: Checkout pinned Andor's Trail upstream
        uses: actions/checkout@v5
        with:
          repository: AndorsTrailRelease/andors-trail
          ref: 0dfa1f63ea6d944df2c6d34e641000c09d3e917e
          path: andors-upstream
          sparse-checkout: AndorsTrail

      - name: Apply combat integration overlay
        run: |
          # Full latest known working integration; do NOT use the stale October 4 overlay.
          cp -a stable-integration/andors-trail-combat/overlay/. andors-upstream/
          # Keep the working baseline Dialogs implementation unchanged; patch gameplay focus only.
          BASE=andors-trail-combat/overlay/AndorsTrail/app/src/main/java/com/gpl/rpg/AndorsTrail
          DEST=andors-upstream/AndorsTrail/app/src/main/java/com/gpl/rpg/AndorsTrail
          cp "$BASE/activity/MainActivity.java" "$DEST/activity/MainActivity.java"
          cp "$BASE/controller/GameRoundController.java" "$DEST/controller/GameRoundController.java"
          # Replace Google ML Kit translation with a bundled, offline bilingual dictionary.
          cp "$BASE/anki/AnkiWordTranslator.java" "$DEST/anki/AnkiWordTranslator.java"
          cp andors-trail-combat/overlay/AndorsTrail/app/build.gradle andors-upstream/AndorsTrail/app/build.gradle
          cp andors-trail-combat/overlay/AndorsTrail/app/src/main/assets/anki_offline_dictionary_ATTRIBUTION.txt \
             andors-upstream/AndorsTrail/app/src/main/assets/anki_offline_dictionary_ATTRIBUTION.txt
          # Fail the build if we accidentally lose save-compatibility/game features.
          test -s andors-upstream/AndorsTrail/res/raw/actorconditions_vampirism.json
          test -s andors-upstream/AndorsTrail/app/src/main/java/com/gpl/rpg/AndorsTrail/controller/VampirismController.java
          test -s andors-upstream/AndorsTrail/app/src/main/java/com/gpl/rpg/AndorsTrail/anki/AnkiWordTranslator.java
          grep -q 'recoverOrphanedBlockingActivityPause' "$DEST/activity/MainActivity.java"
          ! grep -q 'com.google.mlkit' "$DEST/anki/AnkiWordTranslator.java"
          ! grep -q 'com.google.mlkit' andors-upstream/AndorsTrail/app/build.gradle

      - name: Generate packaged offline English-Vietnamese dictionary
        run: |
          python3 tools/build_offline_anki_dictionary.py andors-upstream/AndorsTrail/app/src/main/assets
          python3 - <<'PY'
          from pathlib import Path
          p = Path("andors-upstream/AndorsTrail/app/src/main/assets")
          vi = (p / "anki_vi_en_dictionary.tsv").read_text(encoding="utf-8")
          en = (p / "anki_en_vi_dictionary.tsv").read_text(encoding="utf-8")
          assert len(vi.splitlines()) > 30000, "Vietnamese dictionary incomplete"
          assert "độc lập\t" in vi, "compound missing"
          assert "polite\tlịch sự" in en, "English test word missing"
          print("Offline bilingual lookup assets validated")
          PY



      - name: Configure stable test signing key
        run: |
          cp tools/fallback-release-keystore.jks andors-upstream/AndorsTrail/andors-debug-keystore.jks
          cat > andors-upstream/AndorsTrail/keystore.properties <<'EOF'
          betaStoreFile=../andors-debug-keystore.jks
          betaStorePassword=Test@123
          betaKeyAlias=my-key
          betaKeyPassword=Test@123
          EOF

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android 36 SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Record reproducible source provenance
        run: |
          mkdir -p build-provenance
          printf 'integration_repository=kd40000-dot/AndorsTrail-Anki-Combat\n' > build-provenance/build-info.txt
          printf 'integration_commit=%s\n' "$GITHUB_SHA" >> build-provenance/build-info.txt
          printf 'maintained_integration_commit=c2a148e5c35a4bb70a1beb407be4787947759381\n' >> build-provenance/build-info.txt
          printf 'upstream_commit=0dfa1f63ea6d944df2c6d34e641000c09d3e917e\n' >> build-provenance/build-info.txt
          (cd andors-upstream && git status --short) > build-provenance/overlay-status.txt
          tar -czf build-provenance/complete-build-source.tar.gz -C andors-upstream AndorsTrail
          sha256sum build-provenance/complete-build-source.tar.gz > build-provenance/source-sha256.txt

      - name: Assemble UI test APK
        run: |
          cd andors-upstream/AndorsTrail
          ./gradlew assembleDebug

      - name: Verify APK archive
        run: |
          APK=$(find andors-upstream/AndorsTrail/app/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)
          test -s "$APK"
          unzip -t "$APK" > /dev/null
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: andors-trail-ui-playground-apk
          path: andors-upstream/AndorsTrail/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload exact build source and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: andors-trail-ui-exact-build-source
          path: build-provenance/
          if-no-files-found: warn
          retention-days: 90
